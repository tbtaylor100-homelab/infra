apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      annotations:
        metallb.universe.tf/loadBalancerIPs: "192.168.1.206"
      spec:
        # Local preserves real client IPs through to Traefik middleware (ADR-024).
        # Cluster (default) causes kube-proxy SNAT, replacing client IPs with 10.42.x.x.
        externalTrafficPolicy: Local
    ports:
      web:
        redirectTo:
          port: websecure
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: false
