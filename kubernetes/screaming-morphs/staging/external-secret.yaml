apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: screaming-morphs-staging-secret
  namespace: screaming-morphs-staging
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: screaming-morphs-staging-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: screaming-morphs/staging
