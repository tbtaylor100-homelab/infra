apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aiostreams-tls
  namespace: aiostreams
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: aiostreams-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - aiostreams.screamingmorphs.com
