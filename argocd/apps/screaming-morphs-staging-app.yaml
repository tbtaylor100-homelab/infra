apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: screaming-morphs-staging-app
  # NOTE: ArgoCD applications must be in the argocd namespace
  namespace: argocd
spec:
  project: default
  source:
    # Custom apps manage namepsace + ExternalSecret in infra repo, not app repo
    repoURL: http://forgejo.local:3000/tbtaylor100/screaming_morphs.git
    targetRevision: main
    path: helm/screaming-morphs
    helm:
      valueFiles:
        - values/staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: screaming-morphs-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

